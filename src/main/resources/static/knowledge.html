<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - AI 智能客服</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="page-shell">
    <header class="topbar">
        <div class="brand compact-brand">
            <div class="brand-mark">AI</div>
            <div>
                <h1>知识库管理</h1>
                <p id="knowledgeUserText">未登录</p>
            </div>
        </div>
        <nav class="topbar-actions">
            <a class="link-btn" href="/">客服对话</a>
            <button id="knowledgeLogoutBtn" class="ghost-btn" type="button">退出</button>
        </nav>
    </header>

    <main class="knowledge-layout">
        <section class="workspace-card">
            <div class="section-header">
                <div>
                    <h2>创建知识库</h2>
                    <p>创建后可上传文档并在客服对话中选择使用。</p>
                </div>
            </div>
            <form id="knowledgeForm" class="knowledge-form">
                <div>
                    <label class="field-label" for="knowledgeNameInput">名称</label>
                    <input id="knowledgeNameInput" maxlength="100" placeholder="例如：售后知识库">
                </div>
                <div>
                    <label class="field-label" for="knowledgeDescInput">描述</label>
                    <textarea id="knowledgeDescInput" rows="4" maxlength="500" placeholder="知识库用途说明"></textarea>
                </div>
                <button id="createKnowledgeBtn" class="primary-btn full-btn" type="submit">创建知识库</button>
                <div id="knowledgeMessage" class="form-message" role="status" aria-live="polite"></div>
            </form>
        </section>

        <section class="workspace-card document-card">
            <div class="section-header">
                <div>
                    <h2 id="selectedKnowledgeTitle">文档管理</h2>
                    <p id="selectedKnowledgeMeta">请选择一个知识库</p>
                </div>
                <button id="refreshDocumentListBtn" class="secondary-btn compact-btn" type="button" disabled>刷新</button>
            </div>
            <form id="documentUploadForm" class="document-upload-form">
                <label class="upload-zone" for="documentFileInput">
                    <span id="documentFileText">选择 TXT / MD / PDF / DOCX 文件，最大 20MB</span>
                    <input id="documentFileInput" type="file" accept=".txt,.md,.markdown,.pdf,.docx" disabled>
                </label>
                <button id="uploadDocumentBtn" class="primary-btn compact-btn" type="submit" disabled>上传文档</button>
            </form>
            <div id="documentMessage" class="form-message" role="status" aria-live="polite"></div>
            <div class="document-list-header">
                <span id="documentListHint">未选择知识库</span>
            </div>
            <div id="documentList" class="document-list"></div>
        </section>

        <section class="workspace-card knowledge-list-card">
            <div class="section-header">
                <div>
                    <h2>知识库列表</h2>
                    <p id="knowledgeListHint">加载中</p>
                </div>
                <button id="refreshKnowledgeListBtn" class="secondary-btn compact-btn" type="button">刷新</button>
            </div>
            <div id="knowledgeList" class="knowledge-list"></div>
        </section>
    </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/knowledge.js"></script>
</body>
</html>
