<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能客服工作台</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="chat-page">
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-mark">AI</div>
                <div>
                    <h1>AICS</h1>
                    <p>智能客服</p>
                </div>
            </div>
            <div class="icon-actions">
                <a class="icon-btn" href="/knowledge.html" title="知识库管理" aria-label="知识库管理">KB</a>
                <button id="logoutBtn" class="icon-btn" type="button" title="退出登录" aria-label="退出登录">退出</button>
            </div>
        </div>

        <button id="newConversationBtn" class="new-chat-btn" type="button">
            <span>+</span>
            <span>开启新对话</span>
        </button>

        <section class="mode-card">
            <div class="mode-card-header">
                <div>
                    <span class="eyebrow">对话模式</span>
                    <strong id="workspaceSubtitle">普通对话</strong>
                </div>
                <div class="status-row">
                    <span id="healthDot" class="status-dot"></span>
                    <span id="healthText">检查中</span>
                </div>
            </div>
            <div class="mode-toggle" role="group" aria-label="对话模式">
                <button id="plainModeBtn" class="mode-btn active" type="button">普通对话</button>
                <button id="kbModeBtn" class="mode-btn" type="button">知识库问答</button>
            </div>
            <div id="knowledgePicker" class="knowledge-picker hidden">
                <select id="knowledgeBaseSelect" aria-label="选择知识库">
                    <option value="">选择知识库</option>
                </select>
                <button id="refreshKnowledgeBtn" class="mini-btn" type="button">刷新</button>
            </div>
        </section>

        <section class="history-section">
            <div class="history-heading">30 天内</div>
            <div id="conversationHistory" class="conversation-history"></div>
        </section>

        <footer class="sidebar-footer">
            <span class="avatar-dot">U</span>
            <span id="currentUserText">未登录</span>
        </footer>
    </aside>

    <main class="chat-workspace">
        <header class="workspace-header">
            <div>
                <h2 id="conversationTitle">智能客服对话</h2>
                <p id="conversationIdText">尚未开始</p>
            </div>
            <div id="toast" class="toast" role="status" aria-live="polite"></div>
        </header>

        <section id="messageList" class="message-list">
            <div class="empty-state">
                <strong>今天想处理什么问题？</strong>
                <span>直接输入问题开始对话。</span>
            </div>
        </section>

        <form id="chatForm" class="composer" aria-label="发送消息">
            <textarea id="questionInput" rows="3" placeholder="给智能客服发送消息"></textarea>
            <div class="composer-footer">
                <div id="sourcesList" class="sources-list">
                    <span class="empty-sources">普通对话</span>
                </div>
                <button id="sendBtn" class="send-btn" type="submit" aria-label="发送">↑</button>
            </div>
        </form>
    </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
