<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI 智能客服</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel">
        <div class="brand auth-brand">
            <div class="brand-mark">AI</div>
            <div>
                <h1>智能客服</h1>
                <p>登录后进入客服工作台</p>
            </div>
        </div>

        <form id="loginForm" class="auth-form">
            <label class="field-label" for="usernameInput">用户名</label>
            <input id="usernameInput" autocomplete="username" placeholder="test">

            <label class="field-label" for="passwordInput">密码</label>
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="123456">

            <button id="loginBtn" class="primary-btn full-btn" type="submit">登录</button>
            <div id="loginMessage" class="form-message" role="status" aria-live="polite"></div>
        </form>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
