server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:./config/local-secrets.yml
  datasource:
    mysql:
      jdbc-url: ${MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/ai_customer_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
    vector:
      jdbc-url: ${POSTGRES_VECTOR_JDBC_URL:jdbc:postgresql://localhost:5432/ai_customer_vector}
      username: ${POSTGRES_VECTOR_USERNAME:postgres}
      password: ${POSTGRES_VECTOR_PASSWORD:}
      driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${CHAT_API_KEY:dev-placeholder-key}
      base-url: ${CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        completions-path: ${CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${CHAT_MODEL:qwen-plus}
          temperature: ${CHAT_TEMPERATURE:0.2}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: false
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

rag:
  file-storage-dir: ${RAG_FILE_STORAGE_DIR:./data/uploads}
  chunk-size: ${RAG_CHUNK_SIZE:900}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:120}
  top-k: ${RAG_TOP_K:5}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.2}
  vector-dimension: ${RAG_VECTOR_DIMENSION:768}
